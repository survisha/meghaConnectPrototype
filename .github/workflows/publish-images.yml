name: Build, scan, and publish images

on:
  push:
    branches: [phase2-new-release]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  required-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Backend tests
        working-directory: backend
        run: mvn -B -ntp clean verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend required gates
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npx ng test --watch=false --browsers=ChromeHeadless
          npx ng build --configuration uat

  publish:
    needs: required-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Prepare immutable image coordinates
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "BACKEND_IMAGE=ghcr.io/${owner}/meghaconnect-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${owner}/meghaconnect-frontend" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image metadata
        id: backend_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: type=raw,value=${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
      - name: Frontend image metadata
        id: frontend_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: type=raw,value=${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
      - name: Build backend image locally
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.backend_meta.outputs.tags }}
          build-args: |
            BUILD_VERSION=${{ env.IMAGE_TAG }}
            BUILD_REVISION=${{ github.sha }}
          labels: ${{ steps.backend_meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Build frontend image locally
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.frontend_meta.outputs.tags }}
          build-args: |
            BUILD_CONFIGURATION=uat
            BUILD_VERSION=${{ env.IMAGE_TAG }}
            BUILD_REVISION=${{ github.sha }}
          labels: ${{ steps.frontend_meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Push immutable images
        shell: bash
        run: |
          docker push "${BACKEND_IMAGE}:${IMAGE_TAG}"
          docker push "${FRONTEND_IMAGE}:${IMAGE_TAG}"
      - name: Publish optional UAT aliases
        if: github.ref == 'refs/heads/phase2-new-release'
        shell: bash
        run: |
          docker tag "${BACKEND_IMAGE}:${IMAGE_TAG}" "${BACKEND_IMAGE}:uat-latest"
          docker tag "${FRONTEND_IMAGE}:${IMAGE_TAG}" "${FRONTEND_IMAGE}:uat-latest"
          docker push "${BACKEND_IMAGE}:uat-latest"
          docker push "${FRONTEND_IMAGE}:uat-latest"
      - name: Publish image coordinates
        run: |
          echo "Backend: ${BACKEND_IMAGE}:${IMAGE_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "Frontend: ${FRONTEND_IMAGE}:${IMAGE_TAG}" >> "$GITHUB_STEP_SUMMARY"
