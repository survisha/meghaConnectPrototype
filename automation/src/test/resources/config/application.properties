# MeghaConnect Automation Framework - Configuration

# Environment Configuration
environment=uat
base.url=https://meghaconnect.cloud/
api.base.url=https://meghaconnect.cloud/
browser=chrome
headless=false
implicit.wait=10
explicit.wait=30
page.load.timeout=60

# Browser Configuration
browser.maximize=true
browser.incognito=false
browser.accept.insecure.certs=true

# API Authentication
api.auth.token.endpoint=/api/v1/auth/login
api.auth.username=testuser
api.auth.password=testpassword

# Logging
log.level=INFO
log.path=logs/
log.filename=automation.log

# Reporting
report.path=test-output/
report.screenshots=true
extent.report.title=MeghaConnect Automation Report
extent.report.author=QA Automation Team

# Test Data
test.data.path=src/test/resources/testdata/
test.data.format=json
testdata.excel.path=src/test/resources/testdata/citizen-login-testdata.xlsx
test.otp=123456
otp.mode=UI_DEMO

# Retry Configuration
retry.count=2
wait.between.retries=3000

# API Timeout
api.request.timeout=30000
api.connection.timeout=10000

# Database (if needed)
db.host=localhost
db.port=3306
db.name=meghaconnect_test
db.username=root
db.password=

# Email Configuration (for alerts)
email.enabled=false
email.smtp.server=
email.smtp.port=
email.from=automation@meghaconnect.com
email.to=qa-team@meghaconnect.com

# Slack Notifications
slack.enabled=false
slack.webhook.url=

# Screenshot Policy
screenshot.on.pass=false
screenshot.on.fail=true
screenshot.on.step=false
highlight.enabled=true
screenshot.each.step=true
highlight.duration.ms=700

# Video Recording
video.recording.enabled=false
video.output.path=videos/

# Parallel Execution
parallel.execution=false
thread.count=1
