# UAT/dev deployment profile.
# Activate with SPRING_PROFILES_ACTIVE=dev from systemd or the shell.

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

cache:
  redis:
    environment: dev
    enabled: ${REDIS_CACHE_ENABLED:false}

spring:
  data:
    redis:
      repositories:
        enabled: false
  datasource:
    # Use +05:30 for the MySQL session because named zones require MySQL timezone tables.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:meghaconnect_db}?useSSL=false&connectionTimeZone=%2B05:30&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:meghaconnect_user}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQL8Dialect
        jdbc:
          time_zone: Asia/Kolkata
  jackson:
    time-zone: Asia/Kolkata
    serialization:
      write-dates-as-timestamps: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

management:
  server:
    port: ${MANAGEMENT_PORT:9091}
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: meghaconnect-api
      environment: dev
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.9,0.95,0.99
      slo:
        http.server.requests: 100ms,300ms,500ms,1s,2s,5s
  endpoints:
    enabled-by-default: true
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      enabled: true
      probes:
        enabled: true
      show-details: when_authorized
      show-components: when_authorized
    info:
      enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true

info:
  app:
    name: MeghaConnect API
    environment: dev
    version: 1.0.0-SNAPSHOT
    java: 17

springdoc:
  api-docs:
    enabled: true
    path: /api/v3/api-docs
  swagger-ui:
    enabled: true
    path: /api/swagger-ui.html
    config-url: /api/v3/api-docs/swagger-config
    url: /api/v3/api-docs
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_MIN_256_BIT_SECRET_FOR_UAT_ONLY}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

file:
  upload:
    root-path: ${FILE_UPLOAD_ROOT:/opt/meghaconnect/uploads/dev}
    crypto-key-path: ${FILE_UPLOAD_CRYPTO_KEY_PATH:/opt/meghaconnect/secure/crypto.key}

meghaconnect:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,https://meghaconnect.cloud}
  storage:
    base-path: ${file.upload.root-path}
    crypto-key-path: ${file.upload.crypto-key-path}
    base-url: ${STORAGE_BASE_URL:https://meghaconnect.cloud/api/uploads}
    visitor-photo-path: ${STORAGE_VISITOR_PHOTO_PATH:visitor-photos}
    allowed-types: ${STORAGE_ALLOWED_TYPES:pdf,jpg,jpeg,png,doc,docx}
    max-file-size-mb: ${STORAGE_MAX_FILE_SIZE_MB:25}
  public-darbar:
    scheduler-delay-ms: ${PUBLIC_DARBAR_SCHEDULER_DELAY_MS:60000}
    start-time: ${PUBLIC_DARBAR_START_TIME:10:00}
    slot-duration-minutes: ${PUBLIC_DARBAR_SLOT_DURATION_MINUTES:10}

sms:
  enabled: ${SMS_ENABLED:false}
  provider: ping4sms
  base-url: ${SMS_BASE_URL:https://site.ping4sms.com/api/smsapi}
  api-key: ${SMS_API_KEY:}
  route: ${SMS_ROUTE:2}
  sender-id: ${SMS_SENDER_ID:DEUPL}

ai:
  provider: ${AI_PROVIDER:ollama}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
  ollama:
    enabled: ${OLLAMA_ENABLED:true}
    base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
    model: ${OLLAMA_MODEL:llama3.2}
    generate-endpoint: ${OLLAMA_GENERATE_ENDPOINT:/api/generate}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
    max-input-chars: ${AI_MAX_INPUT_CHARS:12000}
  openai:
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
  azure-openai:
    endpoint: ${AZURE_OPENAI_ENDPOINT:}
    api-key: ${AZURE_OPENAI_API_KEY:}
    deployment: ${AZURE_OPENAI_DEPLOYMENT:}
  form-extraction:
    enabled: ${FORM_EXTRACTION_ENABLED:true}
    provider: ${FORM_EXTRACTION_PROVIDER:ollama}
    max-image-size-bytes: ${FORM_EXTRACTION_MAX_IMAGE_SIZE_BYTES:5242880}
    connect-timeout-seconds: ${FORM_EXTRACTION_CONNECT_TIMEOUT_SECONDS:10}
    read-timeout-seconds: ${FORM_EXTRACTION_READ_TIMEOUT_SECONDS:120}
    form-version: ${VISITOR_FORM_VERSION:V1}
    language-hint: ${FORM_EXTRACTION_LANGUAGE_HINT:en}
    ollama:
      enabled: ${OLLAMA_FORM_EXTRACTION_ENABLED:true}
      base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
      model: ${OLLAMA_VISION_MODEL:qwen2.5vl:3b}
      chat-path: ${OLLAMA_CHAT_PATH:/api/chat}
      stream: false
      temperature: 0
      connect-timeout-seconds: ${OLLAMA_CONNECT_TIMEOUT_SECONDS:10}
      write-timeout-seconds: ${OLLAMA_WRITE_TIMEOUT_SECONDS:120}
      read-timeout-seconds: ${OLLAMA_READ_TIMEOUT_SECONDS:360}
      call-timeout-seconds: ${OLLAMA_CALL_TIMEOUT_SECONDS:390}
      keep-alive: ${OLLAMA_KEEP_ALIVE:10m}
    openai:
      enabled: ${OPENAI_FORM_EXTRACTION_ENABLED:false}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_FORM_EXTRACTION_MODEL:}
      responses-path: ${OPENAI_RESPONSES_PATH:/responses}
      timeout-seconds: ${OPENAI_FORM_EXTRACTION_TIMEOUT_SECONDS:60}
      store-response: false
      image-detail: ${OPENAI_IMAGE_DETAIL:high}
      max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:1000}

document:
  preview:
    conversion:
      enabled: ${DOCUMENT_PREVIEW_CONVERSION_ENABLED:true}
      timeout-seconds: ${DOCUMENT_PREVIEW_CONVERSION_TIMEOUT_SECONDS:30}
    converter: LIBREOFFICE
    libreoffice:
      path: ${LIBREOFFICE_PATH:soffice}
    cache-dir: ${DOCUMENT_PREVIEW_CACHE_DIR:${java.io.tmpdir}/meghaconnect-preview-cache}

epic-api:
  enabled: ${EPIC_API_ENABLED:false}
  endpoint: ${EPIC_API_ENDPOINT:https://devuat.offlinekyc.com/ECSOVDServiceV2}
  api-key: ${EPIC_API_KEY:}

integration:
  openai:
    form-extraction:
      enabled: ${OPENAI_FORM_EXTRACTION_ENABLED:false}
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model: ${OPENAI_FORM_EXTRACTION_MODEL:}
      connect-timeout-seconds: ${OPENAI_CONNECT_TIMEOUT_SECONDS:10}
      read-timeout-seconds: ${OPENAI_READ_TIMEOUT_SECONDS:60}
      max-image-size-bytes: ${OPENAI_MAX_IMAGE_SIZE_BYTES:5242880}
      image-detail: ${OPENAI_IMAGE_DETAIL:high}
      max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:1000}
      store-response: ${OPENAI_STORE_RESPONSE:false}
      form-version: ${VISITOR_FORM_VERSION:V1}
      min-image-width: ${OPENAI_MIN_IMAGE_WIDTH:640}
      min-image-height: ${OPENAI_MIN_IMAGE_HEIGHT:480}
      max-name-length: ${OPENAI_MAX_NAME_LENGTH:150}
      max-address-length: ${OPENAI_MAX_ADDRESS_LENGTH:500}
      min-age: ${OPENAI_MIN_AGE:1}
      max-age: ${OPENAI_MAX_AGE:120}
  epic-face:
    enabled: ${EPIC_FACE_ENABLED:false}
    base-url: ${EPIC_FACE_BASE_URL:https://prdev.onlineipv.com/MeghalayaEPICFaceMW}
    search-1n-path: ${EPIC_FACE_1N_PATH:/FaceService1N}
    verify-11-path: ${EPIC_FACE_11_PATH:/FaceService11}
    search-api-key: ${EPIC_FACE_1N_API_KEY:}
    verify-api-key: ${EPIC_FACE_11_API_KEY:}
    connect-timeout-seconds: ${EPIC_FACE_CONNECT_TIMEOUT:10}
    read-timeout-seconds: ${EPIC_FACE_READ_TIMEOUT:60}
    write-timeout-seconds: ${EPIC_FACE_WRITE_TIMEOUT:30}
    call-timeout-seconds: ${EPIC_FACE_CALL_TIMEOUT:90}
  face-recognition:
    enabled: ${FACE_RECOGNITION_ENABLED:true}
    base-url: ${FACE_RECOGNITION_BASE_URL:https://prdev.onlineipv.com/DeepFaceService}
    api-key: ${FACE_RECOGNITION_API_KEY:72e4cd6e-eebd-46e3-a7d3-583fbe136b31}
    enroll:
      api-key: ${FACE_RECOGNITION_ENROLL_API_KEY:${FACE_RECOGNITION_API_KEY:b1dc3d57-1976-4799-8e22-cb6d71905dc0}}
    client-id: ${FACE_RECOGNITION_CLIENT_ID:MEGHALAYA}
    app-id: ${FACE_RECOGNITION_APP_ID:CMD}
    connect-timeout-seconds: ${FACE_RECOGNITION_CONNECT_TIMEOUT_SECONDS:10}
    read-timeout-seconds: ${FACE_RECOGNITION_READ_TIMEOUT_SECONDS:60}
    write-timeout-seconds: ${FACE_RECOGNITION_WRITE_TIMEOUT_SECONDS:60}
    max-photo-size-bytes: ${FACE_RECOGNITION_MAX_PHOTO_SIZE_BYTES:5242880}
    allowed-photo-formats:
      - image/jpeg
      - image/png

logging:
  level:
    root: INFO
    com.survisha.meghaconnect: DEBUG
    org.springframework: INFO
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql: OFF
    org.hibernate.orm.jdbc.bind: OFF
  file:
    name: ${LOGGING_PATH:/opt/meghaconnect/logs}/meghaconnect-api.log
  logback:
    rollingpolicy:
      file-name-pattern: ${LOGGING_PATH:/opt/meghaconnect/logs}/meghaconnect-api.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 25MB
      max-history: 30
      total-size-cap: 2GB
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS,Asia/Kolkata} %-5level [requestId=%X{requestId:-}] [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS,Asia/Kolkata} %-5level [requestId=%X{requestId:-}] [%thread] %logger{36} - %msg%n"

legacy:
  datasource:
    url: ${LEGACY_DATABASE_URL:jdbc:mysql://${LEGACY_DB_HOST:${DB_HOST:localhost}}:${LEGACY_DB_PORT:${DB_PORT:3306}}/${LEGACY_DB_NAME:meghaconnect_legacy}?useSSL=false&connectionTimeZone=%2B05:30&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true}
    username: ${LEGACY_DB_USERNAME:${DB_USERNAME:meghaconnect_legacy_user}}
    password: ${LEGACY_DB_PASSWORD:${DB_PASSWORD:}}
    hikari:
      maximum-pool-size: ${LEGACY_DB_POOL_MAX_SIZE:10}
      minimum-idle: ${LEGACY_DB_POOL_MIN_IDLE:1}
  import:
    storage-path: ${LEGACY_IMPORT_STORAGE_PATH:/opt/meghaconnect/uploads/dev/legacy-import}
    max-file-size-mb: ${LEGACY_IMPORT_MAX_FILE_SIZE_MB:100}
    max-sheets: ${LEGACY_IMPORT_MAX_SHEETS:100}
    max-columns: ${LEGACY_IMPORT_MAX_COLUMNS:300}
    max-rows-per-sheet: ${LEGACY_IMPORT_MAX_ROWS_PER_SHEET:1000000}
    batch-size: ${LEGACY_IMPORT_BATCH_SIZE:500}
