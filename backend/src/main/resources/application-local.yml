spring:
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:50MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:60MB}
  data:
    redis:
      repositories:
        enabled: false

cache:
  redis:
    environment: local
    enabled: ${REDIS_CACHE_ENABLED:false}

legacy:
  datasource:
    url: ${LEGACY_DATABASE_URL:jdbc:mysql://${LEGACY_DB_HOST:localhost}:${LEGACY_DB_PORT:3306}/${LEGACY_DB_NAME:meghaconnect_legacy}?useSSL=false&connectionTimeZone=%2B05:30&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true}
    username: ${LEGACY_DB_USERNAME:${DATABASE_USERNAME:${DB_USERNAME:root}}}
    password: ${LEGACY_DB_PASSWORD:${DATABASE_PASSWORD:${DB_PASSWORD:root}}}
  import:
    storage-path: ${LEGACY_IMPORT_STORAGE_PATH:${java.io.tmpdir}/meghaconnect-legacy-import/local}
    max-file-size-mb: ${LEGACY_IMPORT_MAX_FILE_SIZE_MB:50}
    batch-size: ${LEGACY_IMPORT_BATCH_SIZE:500}
