logging:
  level:
    root: INFO
    com.survisha.meghaconnect: INFO
    org.springframework: WARN
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql: OFF
    org.hibernate.orm.jdbc.bind: OFF
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS,Asia/Kolkata} %-5level [requestId=%X{requestId:-}] [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS,Asia/Kolkata} %-5level [requestId=%X{requestId:-}] [%thread] %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE:logs/meghaconnect-prod.log}
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_FILE_PATTERN:logs/meghaconnect-prod.%d{yyyy-MM-dd}.%i.log.gz}
      max-file-size: ${LOG_FILE_MAX_SIZE:25MB}
      max-history: ${LOG_FILE_MAX_HISTORY:30}
      total-size-cap: ${LOG_FILE_TOTAL_SIZE_CAP:2GB}

spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
  jackson:
    time-zone: Asia/Kolkata
    serialization:
      write-dates-as-timestamps: false

server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      protocol-header: X-Forwarded-Proto

file:
  upload:
    root-path: ${FILE_UPLOAD_ROOT:/opt/meghaconnect/uploads}
    crypto-key-path: ${FILE_UPLOAD_CRYPTO_KEY_PATH:/opt/meghaconnect/secure/crypto.key}

meghaconnect:
  security:
    require-https: true
  storage:
    base-path: ${file.upload.root-path}
    crypto-key-path: ${file.upload.crypto-key-path}

ai:
  ollama:
    enabled: true
    base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
    model: ${OLLAMA_MODEL:llama3.2}
    generate-endpoint: /api/generate
    timeout-seconds: 120
    max-input-chars: 12000
