logging:
  level:
    root: INFO
    com.survisha.meghaconnect: INFO
    org.springframework: WARN
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql: OFF
    org.hibernate.orm.jdbc.bind: OFF
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS,Asia/Kolkata} %-5level [requestId=%X{requestId:-}] [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS,Asia/Kolkata} %-5level [requestId=%X{requestId:-}] [%thread] %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE:${LOGGING_PATH:/opt/meghaconnect/prod/logs}/meghaconnect-prod.log}
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_FILE_PATTERN:${LOGGING_PATH:/opt/meghaconnect/prod/logs}/meghaconnect-prod.%d{yyyy-MM-dd}.%i.log.gz}
      max-file-size: ${LOG_FILE_MAX_SIZE:25MB}
      max-history: ${LOG_FILE_MAX_HISTORY:30}
      total-size-cap: ${LOG_FILE_TOTAL_SIZE_CAP:2GB}

cache:
  redis:
    environment: prod
    enabled: ${REDIS_CACHE_ENABLED:false}

spring:
  data:
    redis:
      repositories:
        enabled: false
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:meghaconnect_prod_b}?useSSL=false&connectionTimeZone=%2B05:30&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true}
    username: ${DATABASE_USERNAME:${DB_USERNAME:}}
    password: ${DATABASE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:4}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
  jackson:
    time-zone: Asia/Kolkata
    serialization:
      write-dates-as-timestamps: false

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8082}
  forward-headers-strategy: native
  tomcat:
    remoteip:
      protocol-header: X-Forwarded-Proto

file:
  upload:
    root-path: ${FILE_UPLOAD_ROOT:/opt/meghaconnect/prod/uploads}
    crypto-key-path: ${FILE_UPLOAD_CRYPTO_KEY_PATH:/opt/meghaconnect/prod/secure/crypto.key}

meghaconnect:
  bootstrap:
    super-admin-username: ${MEGHACONNECT_SUPER_ADMIN_USERNAME:superadmin}
    super-admin-password: ${MEGHACONNECT_SUPER_ADMIN_PASSWORD:}
    super-admin-password-repair-enabled: ${MEGHACONNECT_SUPER_ADMIN_PASSWORD_REPAIR_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://www.meghaconnect.com,https://meghaconnect.com}
  security:
    require-https: true
  storage:
    base-path: ${file.upload.root-path}
    crypto-key-path: ${file.upload.crypto-key-path}
    base-url: ${STORAGE_BASE_URL:https://www.meghaconnect.com/api/uploads}
    visitor-photo-path: ${STORAGE_VISITOR_PHOTO_PATH:visitor-photos}
    allowed-types: ${STORAGE_ALLOWED_TYPES:pdf,jpg,jpeg,png,doc,docx}
    max-file-size-mb: ${STORAGE_MAX_FILE_SIZE_MB:25}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

sms:
  enabled: ${SMS_ENABLED:false}
  provider: ping4sms
  base-url: ${SMS_BASE_URL:https://site.ping4sms.com/api/smsapi}
  api-key: ${SMS_API_KEY:}
  route: ${SMS_ROUTE:2}
  sender-id: ${SMS_SENDER_ID:DEUPL}

management:
  server:
    port: ${MANAGEMENT_PORT:9091}
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    enabled-by-default: true
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      enabled: true
      probes:
        enabled: true
      show-details: when_authorized
    info:
      enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: meghaconnect-api
      environment: prod
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.9,0.95,0.99
      slo:
        http.server.requests: 100ms,300ms,500ms,1s,2s,5s

ai:
  provider: ${AI_PROVIDER:ollama}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
  ollama:
    enabled: ${OLLAMA_ENABLED:true}
    base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
    model: ${OLLAMA_MODEL:llama3.2}
    generate-endpoint: ${OLLAMA_GENERATE_ENDPOINT:/api/generate}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
    max-input-chars: ${AI_MAX_INPUT_CHARS:12000}
  openai:
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
  azure-openai:
    endpoint: ${AZURE_OPENAI_ENDPOINT:}
    api-key: ${AZURE_OPENAI_API_KEY:}
    deployment: ${AZURE_OPENAI_DEPLOYMENT:}
  form-extraction:
    enabled: ${FORM_EXTRACTION_ENABLED:false}
    provider: ${FORM_EXTRACTION_PROVIDER:ollama}
    max-image-size-bytes: ${FORM_EXTRACTION_MAX_IMAGE_SIZE_BYTES:5242880}
    connect-timeout-seconds: ${FORM_EXTRACTION_CONNECT_TIMEOUT_SECONDS:10}
    read-timeout-seconds: ${FORM_EXTRACTION_READ_TIMEOUT_SECONDS:120}
    form-version: ${VISITOR_FORM_VERSION:V1}
    language-hint: ${FORM_EXTRACTION_LANGUAGE_HINT:en}
    ollama:
      enabled: ${OLLAMA_FORM_EXTRACTION_ENABLED:true}
      base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
      model: ${OLLAMA_VISION_MODEL:qwen2.5vl:3b}
      chat-path: ${OLLAMA_CHAT_PATH:/api/chat}
      stream: false
      temperature: 0
      connect-timeout-seconds: ${OLLAMA_CONNECT_TIMEOUT_SECONDS:10}
      write-timeout-seconds: ${OLLAMA_WRITE_TIMEOUT_SECONDS:120}
      read-timeout-seconds: ${OLLAMA_READ_TIMEOUT_SECONDS:360}
      call-timeout-seconds: ${OLLAMA_CALL_TIMEOUT_SECONDS:390}
      keep-alive: ${OLLAMA_KEEP_ALIVE:10m}
    openai:
      enabled: ${OPENAI_FORM_EXTRACTION_ENABLED:false}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_FORM_EXTRACTION_MODEL:}
      responses-path: ${OPENAI_RESPONSES_PATH:/responses}
      timeout-seconds: ${OPENAI_FORM_EXTRACTION_TIMEOUT_SECONDS:60}
      store-response: false
      image-detail: ${OPENAI_IMAGE_DETAIL:high}
      max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:1000}

document:
  preview:
    conversion:
      enabled: ${DOCUMENT_PREVIEW_CONVERSION_ENABLED:true}
      timeout-seconds: ${DOCUMENT_PREVIEW_CONVERSION_TIMEOUT_SECONDS:30}
    converter: LIBREOFFICE
    libreoffice:
      path: ${LIBREOFFICE_PATH:soffice}
    cache-dir: ${DOCUMENT_PREVIEW_CACHE_DIR:${java.io.tmpdir}/meghaconnect-preview-cache}

integration:
  openai:
    form-extraction:
      enabled: ${OPENAI_FORM_EXTRACTION_ENABLED:false}
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model: ${OPENAI_FORM_EXTRACTION_MODEL:}
      connect-timeout-seconds: ${OPENAI_CONNECT_TIMEOUT_SECONDS:10}
      read-timeout-seconds: ${OPENAI_READ_TIMEOUT_SECONDS:60}
      max-image-size-bytes: ${OPENAI_MAX_IMAGE_SIZE_BYTES:5242880}
      image-detail: ${OPENAI_IMAGE_DETAIL:high}
      max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:1000}
      store-response: ${OPENAI_STORE_RESPONSE:false}
      form-version: ${VISITOR_FORM_VERSION:V1}
      min-image-width: ${OPENAI_MIN_IMAGE_WIDTH:640}
      min-image-height: ${OPENAI_MIN_IMAGE_HEIGHT:480}
      max-name-length: ${OPENAI_MAX_NAME_LENGTH:150}
      max-address-length: ${OPENAI_MAX_ADDRESS_LENGTH:500}
      min-age: ${OPENAI_MIN_AGE:1}
      max-age: ${OPENAI_MAX_AGE:120}
  face-recognition:
    enabled: ${FACE_RECOGNITION_ENABLED:false}
    base-url: ${FACE_RECOGNITION_BASE_URL:https://prdev.onlineipv.com/DeepFaceService}
    api-key: ${FACE_RECOGNITION_API_KEY:}
    enroll:
      api-key: ${FACE_RECOGNITION_ENROLL_API_KEY:${FACE_RECOGNITION_API_KEY:}}
    client-id: ${FACE_RECOGNITION_CLIENT_ID:MEGHALAYA}
    app-id: ${FACE_RECOGNITION_APP_ID:CMD}
    connect-timeout-seconds: ${FACE_RECOGNITION_CONNECT_TIMEOUT_SECONDS:10}
    read-timeout-seconds: ${FACE_RECOGNITION_READ_TIMEOUT_SECONDS:60}
    write-timeout-seconds: ${FACE_RECOGNITION_WRITE_TIMEOUT_SECONDS:60}
    max-photo-size-bytes: ${FACE_RECOGNITION_MAX_PHOTO_SIZE_BYTES:5242880}
    allowed-photo-formats:
      - image/jpeg
      - image/png
