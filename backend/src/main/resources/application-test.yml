file:
  upload:
    root-path: ${FILE_UPLOAD_ROOT:/tmp/meghaconnect/uploads/test}
    crypto-key-path: ${FILE_UPLOAD_CRYPTO_KEY_PATH:/opt/meghaconnect/secure/crypto.key}

spring:
  jackson:
    time-zone: Asia/Kolkata
    serialization:
      write-dates-as-timestamps: false
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata

meghaconnect:
  storage:
    base-path: ${file.upload.root-path}
    crypto-key-path: ${file.upload.crypto-key-path}

ai:
  provider: ${AI_PROVIDER:ollama}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:10}
  ollama:
    enabled: ${OLLAMA_ENABLED:false}
    base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
    model: ${OLLAMA_MODEL:llama3.2}
    generate-endpoint: ${OLLAMA_GENERATE_ENDPOINT:/api/generate}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:10}
    max-input-chars: ${AI_MAX_INPUT_CHARS:12000}
  openai:
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
  azure-openai:
    endpoint: ${AZURE_OPENAI_ENDPOINT:}
    api-key: ${AZURE_OPENAI_API_KEY:}
    deployment: ${AZURE_OPENAI_DEPLOYMENT:}
