# Application
spring.application.name=meghaconnect
server.port=${SERVER_PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Database - MySQL 8
# Use the IST offset for the MySQL session because many production MySQL servers do not load named timezone tables.
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/meghaconnect_db?useSSL=false&connectionTimeZone=%2B05:30&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Timezone
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.serialization.write-dates-as-timestamps=false

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

# JWT - MUST be overridden via JWT_SECRET environment variable in production
app.jwt.secret=${JWT_SECRET:dGhpc0lzT05MWUZPUkxPQ0FMREVWRUxPUE1FTlRQTEVBU0VDSEFOR0VJTlBST0Q=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# File Storage
file.upload.root-path=${FILE_UPLOAD_ROOT:${STORAGE_BASE_PATH:/opt/meghaconnect/uploads}}
file.upload.crypto-key-path=${FILE_UPLOAD_CRYPTO_KEY_PATH:/opt/meghaconnect/secure/crypto.key}
meghaconnect.storage.base-path=${file.upload.root-path}
meghaconnect.storage.crypto-key-path=${file.upload.crypto-key-path}
meghaconnect.storage.base-url=${STORAGE_BASE_URL:http://localhost:8080/uploads}
meghaconnect.storage.visitor-photo-path=${STORAGE_VISITOR_PHOTO_PATH:visitor-photos}
meghaconnect.storage.allowed-types=pdf,jpg,jpeg,png,doc,docx
meghaconnect.storage.max-file-size-mb=${STORAGE_MAX_FILE_SIZE_MB:10}

# Logging
logging.level.root=INFO
logging.level.com.survisha.meghaconnect=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS,Asia/Kolkata} %-5level [requestId=%X{requestId:-}] [%thread] %logger{36} - %msg%n

# Disabled by default because it prints password hashes for local migration utilities.
meghaconnect.security.password-hash-generator.enabled=${PASSWORD_HASH_GENERATOR_ENABLED:false}

# SpringDoc / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# AI Integration
# Set OPENAI_API_KEY env variable for real AI integration (leave empty for rule-based demo mode)
meghaconnect.ai.api-key=${OPENAI_API_KEY:}
meghaconnect.ai.model=${OPENAI_MODEL:gpt-3.5-turbo}
meghaconnect.ai.timeout-seconds=${OPENAI_TIMEOUT_SECONDS:60}
meghaconnect.ai.max-tokens=${OPENAI_MAX_TOKENS:512}

# Redis Cache
cache.redis.enabled=false
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.timeout=2000ms
spring.redis.database=0

# Aadhaar OVSE (Online Verification of Self-Employed)
# Configure with actual UIDAI credentials in production
ovse.appId=${OVSE_APP_ID:100001}
ovse.apiKey=${OVSE_API_KEY:xwwvygA3MmtwbJmqBiBHsBWQ4xHzwu78}
ovse.endpoint=${OVSE_ENDPOINT:https://ovse.aadhaarkyc.com/OvseMWService/OvseRequest}
ovse.online=${OVSE_ONLINE:true}
ovse.faceAuth=${OVSE_FACE_AUTH:true}

