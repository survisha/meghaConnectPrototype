# Application
spring.application.name=meghaconnect
server.port=${SERVER_PORT:8080}

# Database - MySQL 8
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/meghaconnect_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

# JWT - MUST be overridden via JWT_SECRET environment variable in production
app.jwt.secret=${JWT_SECRET:dGhpc0lzT05MWUZPUkxPQ0FMREVWRUxPUE1FTlRQTEVBU0VDSEFOR0VJTlBST0Q=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# File Storage
meghaconnect.storage.base-path=${STORAGE_BASE_PATH:/uploads}
meghaconnect.storage.base-url=${STORAGE_BASE_URL:http://localhost:8080/uploads}
meghaconnect.storage.allowed-types=pdf,jpg,jpeg,png,doc,docx
meghaconnect.storage.max-file-size-mb=${STORAGE_MAX_FILE_SIZE_MB:10}

# Logging
logging.level.com.survisha=DEBUG

# SpringDoc / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# AI Integration
# Set OPENAI_API_KEY env variable for real AI integration (leave empty for rule-based demo mode)
meghaconnect.ai.api-key=${OPENAI_API_KEY:}
meghaconnect.ai.model=${OPENAI_MODEL:gpt-3.5-turbo}
meghaconnect.ai.timeout-seconds=${OPENAI_TIMEOUT_SECONDS:60}
meghaconnect.ai.max-tokens=${OPENAI_MAX_TOKENS:512}

# Redis Cache
cache.redis.enabled=false
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.timeout=2000ms
spring.redis.database=0

# Aadhaar OVSE (Online Verification of Self-Employed)
# Configure with actual UIDAI credentials in production
ovse.appId=${OVSE_APP_ID:100001}
ovse.apiKey=${OVSE_API_KEY:xwwvygA3MmtwbJmqBiBHsBWQ4xHzwu78}
ovse.endpoint=${OVSE_ENDPOINT:https://ovse.aadhaarkyc.com/OvseMWService/OvseRequest}
ovse.online=${OVSE_ONLINE:true}
ovse.faceAuth=${OVSE_FACE_AUTH:true}
