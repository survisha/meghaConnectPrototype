# Application
spring.application.name=meghaconnect
server.port=${SERVER_PORT:8080}

# Database - set via environment variables in production
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/meghaconnect}
spring.datasource.username=${DATABASE_USERNAME:megha_user}
spring.datasource.password=${DATABASE_PASSWORD:megha_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT - MUST be overridden via JWT_SECRET environment variable in production
# Minimum 256-bit (32-byte) Base64 encoded key
app.jwt.secret=${JWT_SECRET:dGhpc0lzT05MWUZPUkxPQ0FMREVWRUxPUE1FTlRQTEVBU0VDSEFOR0VJTlBST0Q=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Logging
logging.level.gov.meghalaya=DEBUG
