# Application
spring.application.name=meghaconnect
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/meghaconnect
spring.datasource.username=megha_user
spring.datasource.password=megha_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
app.jwt.secret=dGhpc0lzQVZlcnlTZWN1cmVTZWNyZXRLZXkxMjM0NTY3ODkwMTIzNDU2Nzg5MA==
app.jwt.expiration-ms=86400000

# Logging
logging.level.gov.meghalaya=DEBUG
