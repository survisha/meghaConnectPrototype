global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: meghaconnect-api
    metrics_path: /actuator/prometheus
    bearer_token_file: /run/secrets/monitoring_bearer_token
    static_configs:
      - targets: ["backend:9091"]
        labels:
          application: meghaconnect-api
          environment: uat

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: mysql
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
