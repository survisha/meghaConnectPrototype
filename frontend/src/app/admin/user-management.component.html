<div>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem">
    <h2 class="page-title" style="margin:0"><i class="pi pi-users" style="margin-right:0.5rem"></i>User Management</h2>
    <p-button label="Add User" icon="pi pi-plus" (onClick)="openNew()"></p-button>
  </div>

  <div *ngIf="successMsg" style="background:#d1fae5;color:#065f46;padding:0.75rem 1rem;border-radius:6px;margin-bottom:1rem;display:flex;align-items:center;gap:0.5rem">
    <i class="pi pi-check-circle"></i> {{ successMsg }}
  </div>
  <div *ngIf="errorMsg && !showDialog" style="background:#fee2e2;color:#991b1b;padding:0.75rem 1rem;border-radius:6px;margin-bottom:1rem;display:flex;align-items:center;gap:0.5rem">
    <i class="pi pi-exclamation-circle"></i> {{ errorMsg }}
  </div>

  <div class="section-card">
    <div class="section-card-header"><i class="pi pi-list"></i> System Users</div>
    <p-table [value]="users" [paginator]="true" [rows]="10" styleClass="p-datatable-sm" responsiveLayout="scroll">
      <ng-template pTemplate="header">
        <tr>
          <th>Full Name</th>
          <th>Username</th>
          <th>Role</th>
          <th style="text-align:center">Actions</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-u>
        <tr>
          <td><strong>{{ u.fullName }}</strong></td>
          <td><code style="background:#f3f4f6;padding:2px 6px;border-radius:4px">{{ u.username }}</code></td>
          <td><p-tag [value]="roleLabel(u.role)" [severity]="roleBadge(u.role)"></p-tag></td>
          <td style="text-align:center">
            <p-button icon="pi pi-pencil" [text]="true" severity="info" (onClick)="openEdit(u)" pTooltip="Edit"></p-button>
            <p-button icon="pi pi-trash" [text]="true" severity="danger" (onClick)="deleteUser(u)" pTooltip="Delete" [disabled]="u.username === auth.user()?.username"></p-button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>

  <p-dialog [(visible)]="showDialog" [header]="isEdit ? 'Edit User' : 'New User'" [modal]="true" [style]="{width:'420px'}" [draggable]="false">
    <div style="display:flex;flex-direction:column;gap:1rem;padding-top:0.5rem">
      <div *ngIf="errorMsg" style="background:#fee2e2;color:#991b1b;padding:0.6rem 0.75rem;border-radius:6px;font-size:0.85rem">
        <i class="pi pi-exclamation-circle"></i> {{ errorMsg }}
      </div>

      <div class="form-group">
        <label>Full Name *</label>
        <input pInputText [(ngModel)]="form.fullName" placeholder="Full Name" style="width:100%"/>
      </div>

      <div class="form-group">
        <label>Username *</label>
        <input pInputText [(ngModel)]="form.username" placeholder="Username" style="width:100%" [disabled]="isEdit"/>
      </div>

      <div class="form-group">
        <label>Role *</label>
        <p-select [options]="roleOptions" [(ngModel)]="form.role" optionLabel="label" optionValue="value" styleClass="w-full" placeholder="Select role"></p-select>
      </div>

      <div class="form-group">
        <label>Password *</label>
        <p-password [(ngModel)]="form.password" [feedback]="false" [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full" placeholder="Set password"></p-password>
      </div>
    </div>

    <ng-template pTemplate="footer">
      <p-button label="Cancel" icon="pi pi-times" [text]="true" (onClick)="showDialog=false"></p-button>
      <p-button [label]="isEdit ? 'Update' : 'Create'" icon="pi pi-check" (onClick)="save()"></p-button>
    </ng-template>
  </p-dialog>
</div>
