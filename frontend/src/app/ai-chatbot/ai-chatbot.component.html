<div class="chatbot-widget">
  <!-- Floating trigger button -->
  <button class="chatbot-trigger" (click)="toggleChat()" [attr.aria-label]="isOpen ? 'Close chat' : 'Open chat'">
    <i class="pi" [class.pi-comments]="!isOpen" [class.pi-times]="isOpen"></i>
    <span *ngIf="!isOpen">Ask MeghaBot</span>
  </button>

  <!-- Chat window -->
  <div class="chatbot-window" *ngIf="isOpen">
    <div class="chatbot-header">
      <div style="display:flex;align-items:center;gap:0.5rem">
        <div class="bot-avatar"><i class="pi pi-android"></i></div>
        <div>
          <div style="font-weight:700;font-size:0.95rem">MeghaBot</div>
          <div style="font-size:0.72rem;opacity:.8">AI Citizen Assistant · Online</div>
        </div>
      </div>
    </div>

    <div class="chatbot-messages" #messageContainer>
      <div *ngFor="let msg of messages" class="message-row" [class.user-row]="msg.role === 'user'">
        <div class="message-bubble" [class.user-bubble]="msg.role === 'user'" [class.bot-bubble]="msg.role === 'bot'">
          <pre class="message-text">{{ msg.text }}</pre>
          <div class="message-time">{{ msg.time }}</div>
        </div>
      </div>
      <div *ngIf="loading" class="message-row">
        <div class="message-bubble bot-bubble typing-indicator">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>

    <div class="chatbot-input">
      <textarea
        [(ngModel)]="inputText"
        (keydown)="onKeyDown($event)"
        placeholder="Type your question..."
        rows="1"
        class="chat-textarea"
        [disabled]="loading">
      </textarea>
      <button class="send-btn" (click)="sendMessage()" [disabled]="!inputText.trim() || loading">
        <i class="pi pi-send"></i>
      </button>
    </div>
  </div>
</div>
