<section class="password-shell" aria-label="Required password change">
  <form class="password-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Change temporary password</h1>
    <p>You must choose a new password before accessing MeghaConnect.</p>
    <mat-form-field appearance="outline"><mat-label>Current temporary password</mat-label>
      <input matInput type="password" formControlName="currentPassword" autocomplete="current-password" /></mat-form-field>
    <mat-form-field appearance="outline"><mat-label>New password</mat-label>
      <input matInput type="password" formControlName="newPassword" autocomplete="new-password" />
      <mat-hint>10+ characters with upper, lower, number, and special character</mat-hint></mat-form-field>
    <mat-form-field appearance="outline"><mat-label>Confirm new password</mat-label>
      <input matInput type="password" formControlName="confirmPassword" autocomplete="new-password" /></mat-form-field>
    <div *ngIf="errorMsg" class="error" role="alert">{{ errorMsg }}</div>
    <button mat-raised-button color="primary" type="submit" [disabled]="loading">{{ loading ? 'Changing…' : 'Change password' }}</button>
    <button mat-button type="button" (click)="logout()">Logout</button>
  </form>
</section>
