<div>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem">
    <h2 class="page-title" style="margin:0">Dashboard</h2>
    <span style="color:#6b7280;font-size:0.85rem">📅 Thursday, 15 March 2024</span>
  </div>

  <!-- KPI Cards -->
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:1.5rem">
    <div class="kpi-card" *ngFor="let k of kpis">
      <div class="kpi-icon" [style.background]="k.bg">
        <i class="pi {{k.icon}}" [style.color]="k.color" style="font-size:1.4rem"></i>
      </div>
      <div>
        <div class="kpi-value" [style.color]="k.color">{{ k.value }}</div>
        <div class="kpi-label">{{ k.label }}</div>
      </div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem">
    <!-- Today's Schedule (staff only) -->
    <div class="section-card" *ngIf="showSchedule">
      <div class="section-card-header">
        <i class="pi pi-calendar"></i> Today's Schedule
        <a routerLink="/scheduling" style="margin-left:auto;color:#90caf9;font-size:0.8rem">View Full Calendar →</a>
      </div>
      <div class="section-card-body" style="padding:0.75rem">
        <div *ngFor="let evt of todaySchedule" class="cal-slot {{getEventClass(evt.type)}}" style="margin-bottom:6px">
          <div style="display:flex;align-items:center;gap:0.5rem">
            <span style="font-weight:700;font-size:0.8rem;min-width:40px;color:#374151">{{evt.time}}</span>
            <div style="flex:1">
              <div class="event-title">{{evt.title}}</div>
              <div class="event-time"><i class="pi pi-map-marker"></i> {{evt.location}}</div>
            </div>
            <span class="status-badge" style="background:#e0e7ff;color:#3730a3;font-size:0.7rem">{{evt.type}}</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Recent Activity -->
    <div class="section-card">
      <div class="section-card-header"><i class="pi pi-history"></i> Recent Activity</div>
      <div class="section-card-body">
        <div *ngFor="let act of recentActivity" style="display:flex;gap:0.75rem;margin-bottom:1rem;align-items:flex-start">
          <div style="width:32px;height:32px;border-radius:50%;background:#f3f4f6;display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <i class="pi {{act.icon}}" [style.color]="act.color"></i>
          </div>
          <div style="flex:1">
            <div style="font-size:0.85rem;color:#111827">{{act.text}}</div>
            <div style="font-size:0.75rem;color:#9ca3af">{{act.time}}</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Appointment Type Chart (staff only) -->
    <div class="section-card" *ngIf="showCharts">
      <div class="section-card-header"><i class="pi pi-chart-pie"></i> Appointments by Type (This Month)</div>
      <div class="section-card-body" style="height:260px;display:flex;align-items:center;justify-content:center">
        <p-chart type="pie" [data]="appointmentTypeData" [options]="chartOptions" style="width:100%;max-width:340px"></p-chart>
      </div>
    </div>

    <!-- Scheme Stats Chart (staff only) -->
    <div class="section-card" *ngIf="showCharts">
      <div class="section-card-header"><i class="pi pi-chart-bar"></i> Scheme Applications (This Month)</div>
      <div class="section-card-body" style="height:260px;display:flex;align-items:center;justify-content:center">
        <p-chart type="bar" [data]="schemeData" [options]="chartOptions" style="width:100%"></p-chart>
      </div>
    </div>
  </div>

  <!-- Quick Actions (role-filtered) -->
  <div class="section-card" style="margin-top:1.5rem" *ngIf="quickActions.length">
    <div class="section-card-header"><i class="pi pi-bolt"></i> Quick Actions</div>
    <div class="section-card-body" style="display:flex;gap:0.75rem;flex-wrap:wrap">
      <button *ngFor="let a of quickActions" pButton [label]="a.label" [icon]="a.icon"
        [routerLink]="a.route" class="p-button-sm"
        [class.p-button-success]="a.severity==='success'"
        [class.p-button-warning]="a.severity==='warning'"
        [class.p-button-info]="a.severity==='info'"
        [class.p-button-secondary]="a.severity==='secondary'">
      </button>
    </div>
  </div>
</div>
