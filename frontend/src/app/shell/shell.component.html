<div class="app-wrapper">
  <!-- Header -->
  <header class="megha-header">
    <button class="icon-btn" (click)="sidebarOpen = !sidebarOpen">
      <i class="pi pi-bars"></i>
    </button>
    <span style="font-size:1.5rem">🏛️</span>
    <div style="flex:1">
      <div style="font-size:1.1rem;font-weight:700;letter-spacing:.3px">MeghaConnect</div>
      <div style="font-size:0.7rem;opacity:.8">CM Office – Scheduling &amp; Scheme Management | Government of Meghalaya</div>
    </div>
    <div class="header-right">
      <span class="pi pi-bell" style="font-size:1.2rem;cursor:pointer;position:relative">
        <span class="notif-dot"></span>
      </span>
      <div class="user-info">
        <div style="font-size:0.85rem;font-weight:600">{{ auth.user()?.fullName }}</div>
        <div class="role-badge">{{ roleLabel }}</div>
      </div>
      <button class="icon-btn" (click)="logout()" title="Logout">
        <i class="pi pi-sign-out"></i>
      </button>
    </div>
  </header>

  <div class="body-wrapper">
    <!-- Sidebar -->
    <nav class="megha-sidebar" [class.collapsed]="!sidebarOpen">
      <ul class="nav-menu">
        <ng-container *ngFor="let item of menu">
          <li *ngIf="!item.children" class="nav-item">
            <a [routerLink]="item.route" class="nav-link">
              <i class="pi {{ item.icon }}"></i>
              <span *ngIf="sidebarOpen">{{ item.label }}</span>
            </a>
          </li>
          <li *ngIf="item.children" class="nav-group">
            <button class="nav-link nav-group-btn" (click)="toggle(item)">
              <i class="pi {{ item.icon }}"></i>
              <span *ngIf="sidebarOpen" style="flex:1;text-align:left">{{ item.label }}</span>
              <i *ngIf="sidebarOpen" class="pi" [class.pi-chevron-down]="item.expanded" [class.pi-chevron-right]="!item.expanded"></i>
            </button>
            <ul *ngIf="item.expanded && sidebarOpen" class="nav-sub">
              <li *ngFor="let child of item.children">
                <a [routerLink]="child.route" class="nav-sub-link">
                  <i class="pi {{ child.icon }}"></i> {{ child.label }}
                </a>
              </li>
            </ul>
          </li>
        </ng-container>
      </ul>
    </nav>

    <!-- Main -->
    <main class="main-content">
      <p-toast></p-toast>
      <p-confirmDialog></p-confirmDialog>
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
