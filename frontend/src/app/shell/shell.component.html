<div class="app-wrapper">
  <!-- Header -->
  <header class="megha-header" id="shell_header">
    <button id="shell_toggleSidebarBtn" class="icon-btn" (click)="sidebarOpen = !sidebarOpen">
      <mat-icon>menu</mat-icon>
    </button>
    <span class="header-emblem">🏛️</span>
    <div class="header-brand">
      <div class="header-title">MeghaConnect</div>
      <div class="header-subtitle">{{ 'CM_OFFICE_SCHEDULING' | translate }}</div>
    </div>
    <div class="header-right">
      <app-language-selector></app-language-selector>
      <span id="shell_notificationIcon" class="notification-icon" style="cursor:pointer;position:relative">
        <mat-icon>notifications</mat-icon>
        <span class="notif-dot"></span>
      </span>
      <div class="user-info">
        <div style="font-size:0.85rem;font-weight:600">{{ auth.user()?.fullName }}</div>
        <div class="role-badge">{{ roleLabel }}</div>
      </div>
      <button id="shell_logoutBtn" class="icon-btn" (click)="logout()" [title]="'LOGOUT' | translate">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </header>

  <div class="body-wrapper" id="shell_bodyWrapper">
    <!-- Sidebar -->
    <nav class="megha-sidebar" [class.collapsed]="!sidebarOpen" id="shell_sidebar">
      <ul class="nav-menu">
        <ng-container *ngFor="let item of menu; let i = index">
          <li *ngIf="!item.children" class="nav-item">
            <a [id]="'shell_navLink_' + i" [routerLink]="item.route" class="nav-link">
              <mat-icon>{{ item.icon }}</mat-icon>
              <span *ngIf="sidebarOpen">{{ item.labelKey | translate }}</span>
            </a>
          </li>
          <li *ngIf="item.children" class="nav-group">
            <button [id]="'shell_navGroup_' + i" class="nav-link nav-group-btn" (click)="toggle(item)">
              <mat-icon>{{ item.icon }}</mat-icon>
              <span *ngIf="sidebarOpen" style="flex:1;text-align:left">{{ item.labelKey | translate }}</span>
              <mat-icon *ngIf="sidebarOpen">{{ item.expanded ? 'expand_more' : 'chevron_right' }}</mat-icon>
            </button>
            <ul *ngIf="item.expanded && sidebarOpen" class="nav-sub">
              <li *ngFor="let child of item.children; let j = index">
                <a [id]="'shell_navSubLink_' + i + '_' + j" [routerLink]="child.route" class="nav-sub-link">
                  <mat-icon>{{ child.icon }}</mat-icon> {{ child.labelKey | translate }}
                </a>
              </li>
            </ul>
          </li>
        </ng-container>
      </ul>
    </nav>

    <!-- Main -->
    <main class="main-content" id="shell_mainContent">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
