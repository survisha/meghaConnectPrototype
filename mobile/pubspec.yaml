name: megha_connect
description: MeghaConnect AI - AI Powered Appointment & Scheme Management Platform
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.1
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  flutter_secure_storage: 9.2.4
  url_launcher: 6.3.1
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  uuid: ^4.5.3
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo.svg
    - assets/logo-small.png
    - assets/logo-white.png
    - assets/state_map.png
    - assets/CM_Profile_Picture.jpg
    - assets/i18n/
