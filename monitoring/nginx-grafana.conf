location /grafana/ {
    proxy_pass http://127.0.0.1:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

location = /logs {
    return 301 /logs/;
}

location /logs/ {
    proxy_pass http://127.0.0.1:3100/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /sonar {
    return 301 /sonar/;
}

location /sonar/ {
    proxy_pass http://127.0.0.1:9000/sonar/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Required Grafana environment when served from https://meghaconnect.cloud/grafana/:
# GRAFANA_ROOT_URL=https://meghaconnect.cloud/grafana/
# GRAFANA_SERVE_FROM_SUB_PATH=true
#
# Required SonarQube environment when served from https://meghaconnect.cloud/sonar/:
# SONAR_WEB_CONTEXT=/sonar
