global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "meghaconnect-api"
    metrics_path: "/api/actuator/prometheus"
    scheme: "http"
    static_configs:
      - targets:
          - "host.docker.internal:8080"
        labels:
          application: "meghaconnect-api"
          environment: "uat"

    # Ubuntu/Linux fallback if host.docker.internal is unavailable:
    # Replace the target above with "172.17.0.1:8080" or the server's internal IP.
