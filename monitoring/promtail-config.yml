server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: meghaconnect-api
    static_configs:
      - targets:
          - localhost
        labels:
          job: meghaconnect-api
          application: meghaconnect-api
          environment: uat
          __path__: /var/log/meghaconnect/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger
            requestId: requestId
            message: message
      - labels:
          level:
          logger:
          requestId:

  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          application: meghaconnect-nginx
          environment: uat
          __path__: /var/log/nginx/*.log
