sonar.projectKey=meghaconnect
sonar.projectName=MeghaConnect
sonar.projectVersion=1.0.0

sonar.sourceEncoding=UTF-8
sonar.host.url=http://localhost:9000/sonar

sonar.sources=backend/src/main/java,backend/src/main/resources,frontend/src,mobile/lib
sonar.tests=backend/src/test/java,mobile/test
sonar.java.binaries=backend/target/classes

sonar.exclusions=**/target/**,**/build/**,**/dist/**,**/node_modules/**,**/.angular/**,backend/src/main/resources/static/**,**/*.g.dart,**/*.freezed.dart,**/*.lock
sonar.coverage.exclusions=frontend/src/**/*.spec.ts,mobile/test/**,backend/src/test/**
sonar.cpd.exclusions=backend/src/main/resources/db/migration/**

# Run after creating a token in local SonarQube:
# sonar-scanner -Dsonar.token=$SONAR_TOKEN
